services:
  frontend:
    container_name: auth_frontend
    build:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    tty: true
    networks:
      - auth-network
  backend:
    container_name: auth_backend
    build:
      context: ./backend
      dockerfile: ./backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/backend
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - auth-network
  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: auth_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - auth-network

volumes:
  db_data:

networks:
  auth-network:
    driver: bridge
